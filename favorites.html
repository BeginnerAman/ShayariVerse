<html lang="hi" data-theme="dark" data-font-size="normal">
<head>

  <!-- Open Graph -->
  <meta property="og:title" content="My Favorites - ShayariVerse">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* ---- Favorites Page Layout ---- */
    .favorites-page {
      min-height: 100vh;
      padding-top: calc(var(--header-height, 64px) + var(--space-md));
      padding-bottom: calc(var(--bottom-nav-h, 64px) + var(--space-xl));
    }

    .favorites-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }

    /* ---- Page Header ---- */
    .favorites-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-lg) 0 var(--space-md);
    }

    .favorites-header__title {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-semibold);
      color: var(--clr-text-primary);
    }

    .favorites-header__count {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--clr-text-faded);
    }

    .favorites-header__clear {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: var(--weight-medium);
      color: var(--clr-text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-full);
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: color var(--duration-fast), border-color var(--duration-fast), background var(--duration-fast), transform var(--duration-fast);
    }

    .favorites-header__clear:hover {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.4);
      background: rgba(248, 113, 113, 0.08);
    }

    .favorites-header__clear:active {
      transform: scale(0.95);
    }

    .favorites-header__clear .lucide {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ---- In-App Confirmation Modal ---- */
    .confirm-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: var(--z-modal, 400);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      animation: fadeIn 0.2s var(--ease-smooth);
    }

    .confirm-modal-overlay.active {
      display: flex;
    }

    .confirm-modal {
      background: rgba(18, 14, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: var(--space-xl) var(--space-lg);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(248, 113, 113, 0.12);
      animation: modalSpringUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalSpringUp {
      from { transform: scale(0.92) translateY(12px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .confirm-modal__icon-box {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-md);
      box-shadow: 0 0 20px rgba(248, 113, 113, 0.2);
    }

    .confirm-modal__icon-box .lucide {
      width: 26px;
      height: 26px;
      color: #f87171;
    }

    .confirm-modal__title {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--clr-text-primary);
      margin-bottom: var(--space-xs);
    }

    .confirm-modal__subtitle {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--clr-text-secondary);
      line-height: 1.55;
      margin-bottom: var(--space-lg);
    }

    .confirm-modal__actions {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
    }

    .confirm-modal__actions .btn {
      flex: 1;
      padding: 10px 16px;
      font-size: var(--text-sm);
      border-radius: var(--radius-full);
    }

    .btn--danger {
      background: #ef4444;
      color: #ffffff;
      border: 1px solid #ef4444;
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    .btn--danger:hover {
      background: #dc2626;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.5);
    }

    .btn--danger:active {
      transform: scale(0.96);
    }

    /* ---- Empty State ---- */
    .favorites-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      min-height: 55vh;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
    }

    .favorites-empty__icon-box {
      width: 76px;
      height: 76px;
      border-radius: var(--radius-full);
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(244, 63, 94, 0.25);
      animation: emptyFloat 3s ease-in-out infinite;
      margin-bottom: var(--space-xs);
    }

    .favorites-empty__icon-box .lucide {
      width: 36px;
      height: 36px;
      color: #f43f5e;
    }

    @keyframes emptyFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    .favorites-empty__title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      color: var(--clr-text-primary);
      margin: 0;
    }

    .favorites-empty__subtitle {
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      color: var(--clr-text-secondary);
      max-width: 340px;
      line-height: 1.6;
      margin: 0 0 var(--space-md);
    }

    /* ---- Card Modal (reuse from browse) ---- */
    .card-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      animation: fadeIn var(--duration-normal) var(--ease-smooth);
    }
    .card-modal-overlay.active { display: flex; }
    .card-modal {
      background: var(--clr-bg-elevated);
      border-radius: var(--radius-xl);
      padding: var(--space-lg);
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: modalIn var(--duration-normal) var(--ease-bounce);
    }
    .card-modal__preview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: var(--radius-md);
      margin-bottom: var(--space-lg);
      box-shadow: var(--shadow-lg);
    }
    .card-modal__actions { display: flex; gap: var(--space-md); justify-content: center; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    /* ---- Font Size ---- */
    .font-controls { display: flex; align-items: center; gap: var(--space-3xs); }
    .font-controls__btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border: 1px solid var(--clr-border); border-radius: var(--radius-sm);
      background: none; cursor: pointer;
      font-family: var(--font-ui); font-size: var(--text-sm); font-weight: var(--weight-semibold);
      color: var(--clr-text-secondary);
      transition: color var(--duration-fast), background var(--duration-fast);
    }
    .font-controls__btn:hover:not(:disabled) { color: var(--clr-accent); background: var(--clr-accent-subtle); }
    .font-controls__btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (prefers-reduced-motion: reduce) {
      .favorites-empty__icon { animation: none; }
    }
  </style>
</head>

<body>

  <!-- ================================
       HEADER
       ================================ -->
  <header class="header" role="banner">
    <a href="index.html" class="header__logo" aria-label="ShayariVerse Home">
      <img src="icons/favicon.png" alt="ShayariVerse Logo" class="header__logo-img" style="width: 28px; height: 28px; border-radius: 7px; object-fit: cover; box-shadow: 0 0 12px rgba(139, 92, 246, 0.45);">

    </a>

  <!-- ================================

  <div class="confirm-modal-overlay" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">

  <!-- ================================

       ================================ -->
  <div class="card-modal-overlay" id="card-modal">
    <div class="card-modal">

  <!-- ================================

  <!-- ================================

      <i data-lucide="compass" class="bottom-nav__icon"></i>

  <!-- ================================
       SCRIPTS
       ================================ -->
  <script type="module">
    import * as ThemeManager from './js/theme-manager.js';
    import * as FavoritesManager from './js/favorites-manager.js';
    import * as ShareManager from './js/share-manager.js';
    import { loadShayaris, getAllShayaris, renderShayariCards } from './js/shayari-loader.js';


    /* ---- Utilities ---- */
    let favToastTimer = null;
    let favToastExitTimer = null;

    function showToast(message, type = '') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      if (favToastTimer) clearTimeout(favToastTimer);
      if (favToastExitTimer) clearTimeout(favToastExitTimer);

      container.innerHTML = '';

      const toast = document.createElement('div');
      toast.className = `toast ${type ? `toast--${type}` : ''} toast-enter`;
      toast.textContent = message;
      toast.setAttribute('role', 'status');
      container.appendChild(toast);

      favToastTimer = setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        favToastExitTimer = setTimeout(() => {
          if (toast.parentNode) toast.remove();
        }, 260);
      }, 1800);
    }


    /* ---- State ---- */
    let allShayaris = [];
    let currentCardShayari = null;


    /* ---- Init ---- */
    async function init() {
      /* Theme */
      ThemeManager.init(updateThemeIcon);
      updateThemeIcon(ThemeManager.get());
      initFontSize();

      /* Load data */
      await loadShayaris();
      allShayaris = getAllShayaris();

      /* Render favorites */
      renderFavorites();

      if (window.lucide) {
        window.lucide.createIcons();
      }

      /* Theme toggle */
      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        const t = ThemeManager.cycle();
        const labels = { dark: 'Dark Mode', light: 'Light Mode', sepia: 'Sepia Mode' };
        showToast(labels[t] || t, '');
      });

      /* In-app Clear All Confirmation Modal */
      const confirmModal = document.getElementById('confirm-modal');
      const confirmCancelBtn = document.getElementById('confirm-cancel');
      const confirmActionBtn = document.getElementById('confirm-action');

      function openConfirmModal() {
        if (!confirmModal) return;
        confirmModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeConfirmModal() {
        if (!confirmModal) return;
        confirmModal.classList.remove('active');
        document.body.style.overflow = '';
      }

      document.getElementById('fav-clear-all')?.addEventListener('click', openConfirmModal);
      confirmCancelBtn?.addEventListener('click', closeConfirmModal);
      confirmModal?.addEventListener('click', (e) => {
        if (e.target === confirmModal) closeConfirmModal();
      });

      confirmActionBtn?.addEventListener('click', () => {
        closeConfirmModal();
        FavoritesManager.clearAll();
        renderFavorites();
        showToast('All favorites cleared', '');
      });

      /* Card actions - event delegation */
      document.getElementById('favorites-area')?.addEventListener('click', handleCardAction);

      /* Share card modal */
      document.getElementById('card-close')?.addEventListener('click', closeCardModal);
      document.getElementById('card-modal')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeCardModal();
      });
      document.getElementById('card-download')?.addEventListener('click', async () => {
        if (!currentCardShayari) return;
        const ok = await ShareManager.downloadCard(currentCardShayari);
        if (ok) showToast('Card downloaded successfully', 'success');
      });
      document.getElementById('card-share')?.addEventListener('click', async () => {
        if (!currentCardShayari) return;
        await ShareManager.shareWithCard(currentCardShayari);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }


    /* ---- Render Favorites ---- */
    function renderFavorites() {
      const area = document.getElementById('favorites-area');
      const countEl = document.getElementById('fav-count');
      const clearBtn = document.getElementById('fav-clear-all');
      if (!area) return;

      const favIds = FavoritesManager.getAll();
      const favShayaris = allShayaris.filter((s) => favIds.includes(s.id));

      if (countEl) countEl.textContent = favShayaris.length > 0 ? `${favShayaris.length} saved shayari${favShayaris.length !== 1 ? 's' : ''}` : '';
      if (clearBtn) clearBtn.style.display = favShayaris.length > 0 ? 'inline-block' : 'none';

      if (favShayaris.length === 0) {
        area.innerHTML = `
          <div class="favorites-empty">
            <div class="favorites-empty__icon-box">
              <i data-lucide="heart"></i>
            </div>
            <h2 class="favorites-empty__title">No Favorites Yet</h2>
            <p class="favorites-empty__subtitle">
              Save your favorite couplets from Browse or Reels to build your personal collection here.
            </p>
            <a href="browse.html" class="btn btn--primary">
              <i data-lucide="compass" style="width: 16px; height: 16px; margin-right: 6px;"></i>
              Explore Poetry
            </a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      /* Create grid and render cards */
      area.innerHTML = '<div class="shayari-grid" id="fav-grid"></div>';
      const grid = document.getElementById('fav-grid');
      renderShayariCards(grid, favShayaris);
      FavoritesManager.restoreUI();
      if (window.lucide) window.lucide.createIcons();
    }


    /* ---- Card Action Handler ---- */
    async function handleCardAction(e) {
      /* Favorite (remove) */
      const favBtn = e.target.closest('.action-favorite');
      if (favBtn) {
        const id = favBtn.dataset.id;
        FavoritesManager.remove(id);
        favBtn.classList.add('heart-pop');
        showToast('Removed from Favorites', '');
        /* Re-render after animation */
        setTimeout(() => renderFavorites(), 400);
        return;
      }

      /* Copy */
      const copyBtn = e.target.closest('.action-copy');
      if (copyBtn) {
        const text = decodeURIComponent(copyBtn.dataset.text || '');
        const ok = await ShareManager.copyText(text);
        showToast(ok ? 'Shayari copied to clipboard' : 'Could not copy', ok ? 'success' : 'error');
        copyBtn.classList.add('copy-success');
        copyBtn.addEventListener('animationend', () => copyBtn.classList.remove('copy-success'), { once: true });
        return;
      }

      /* Share (open card modal) */
      const shareBtn = e.target.closest('.action-share');
      if (shareBtn) {
        const id = shareBtn.dataset.id;
        const shayari = allShayaris.find((s) => s.id === id);
        if (shayari) {
          currentCardShayari = shayari;
          openCardModal(shayari);
        }
        return;
      }
    }


    /* ---- Share Card Modal ---- */
    async function openCardModal(shayari) {
      const modal = document.getElementById('card-modal');
      const preview = document.getElementById('card-modal-preview');
      if (!modal || !preview) return;
      try {
        const blob = await ShareManager.generateCard(shayari);
        const url = URL.createObjectURL(blob);
        preview.src = url;
        preview.onload = () => URL.revokeObjectURL(url);
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      } catch (err) {
        showToast('Could not generate card', 'error');
      }
    }

    function closeCardModal() {
      const modal = document.getElementById('card-modal');
      if (modal) modal.classList.remove('active');
      document.body.style.overflow = '';
      currentCardShayari = null;
    }


    /* ---- Theme Icon ---- */
    function updateThemeIcon(theme) {
      const moon = document.querySelector('.icon-moon');
      const sun = document.querySelector('.icon-sun');
      const book = document.querySelector('.icon-book');
      if (moon) moon.style.display = theme === 'dark' ? 'block' : 'none';
      if (sun) sun.style.display = theme === 'light' ? 'block' : 'none';
      if (book) book.style.display = theme === 'sepia' ? 'block' : 'none';
    }


    /* ---- Font Size ---- */
    function initFontSize() {
      const sizes = ['small', 'normal', 'large'];
      let current = localStorage.getItem('sv-font-size') || 'normal';
      document.documentElement.setAttribute('data-font-size', current);
      document.getElementById('font-decrease')?.addEventListener('click', () => {
        const idx = sizes.indexOf(current);
        if (idx > 0) { current = sizes[idx - 1]; apply(); }
      });
      document.getElementById('font-increase')?.addEventListener('click', () => {
        const idx = sizes.indexOf(current);
        if (idx < sizes.length - 1) { current = sizes[idx + 1]; apply(); }
      });
      function apply() {
        document.documentElement.setAttribute('data-font-size', current);
        localStorage.setItem('sv-font-size', current);
        const decBtn = document.getElementById('font-decrease');
        const incBtn = document.getElementById('font-increase');
        if (decBtn) decBtn.disabled = current === 'small';
        if (incBtn) incBtn.disabled = current === 'large';
      }
      apply();
    }
  </script>
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
