<!DOCTYPE html>

  <!-- Google Fonts -->

  <!-- ================================
       REELS-SPECIFIC STYLES
       Full-screen immersive experience
       ================================ -->
  <style>
    body {
      overflow: hidden;
      background: #06060a;
    }

    /* ---- Reels Container (Scroll Snap Parent) ---- */
    .reels-container {
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
      scrollbar-width: none;
    }
    .reels-container::-webkit-scrollbar {
      display: none;
    }

    /* ---- Single Reel (Scroll Snap Child) ---- */
    .reel {
      position: relative;
      height: 100dvh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      content-visibility: auto;
      contain-intrinsic-size: 100dvh;
    }

    /* ---- Glow Overlay (center radial gradient) ---- */
    .reel__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(192, 132, 252, 0.09) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---- Reel Content (100% Center-Stage Poetry) ---- */
    .reel__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: min(720px, 90vw);
      max-height: calc(100dvh - 160px);
      padding: 60px 24px 80px 24px;
      box-sizing: border-box;
      text-align: center;
      margin: auto;
      opacity: 1;
    }

    /* ---- Shayari Poetry Text ---- */
    .reel__text {
      font-family: 'Kalam', 'Playfair Display', cursive, sans-serif;
      font-size: clamp(1.2rem, 1rem + 1.2vw, 1.75rem);
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: 0.02em;
      color: #f8f3ea;
      text-shadow: 0 0 24px rgba(192, 132, 252, 0.35),
                   0 2px 10px rgba(0, 0, 0, 0.85);
      text-align: center;
      white-space: pre-line;
      word-break: normal;
      overflow-wrap: break-word;
      max-width: 100%;
      margin: 0;
    }

    .reel__poet {
      display: none;
    }

    /* ---- Category Badge (Top-Left) ---- */
    .reel__category {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 78px);
      left: var(--space-lg, 24px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      letter-spacing: 0.02em;
      color: var(--clr-text-secondary);
      text-transform: capitalize;
      background: rgba(16, 12, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-full);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 2;
      opacity: 1;
    }

    .reel__category .lucide {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--clr-accent, #c084fc);
    }

    /* ---- Action Buttons (Fixed Right Edge, Minimalist Glass) ---- */
    .reel__actions {
      position: absolute;
      right: var(--space-lg, 20px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 3;
      opacity: 1;
    }

    .reel__action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(248, 243, 234, 0.9);
      background: rgba(16, 12, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-full);
      cursor: pointer;
      width: 44px;
      height: 44px;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform var(--duration-fast) var(--ease-smooth),
                  background var(--duration-fast) var(--ease-smooth),
                  border-color var(--duration-fast),
                  color var(--duration-fast),
                  box-shadow var(--duration-fast);
    }

    .reel__action-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.08);
      color: #ffffff;
    }

    .reel__action-btn:active {
      transform: scale(0.92);
    }

    .reel__action-btn.active {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.45);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.35);
    }

    .reel__action-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .reel__action-btn:active {
      transform: scale(0.85);
    }

    .reel__action-btn .lucide {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .reel__action-btn.active {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.5);
    }

    .reel__action-btn.active .lucide {
      fill: #f87171;
      filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.6));
    }

    .reel__action-pop {
      animation: reelActionPop 0.4s var(--ease-bounce);
    }

    @keyframes reelActionPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* ---- Music Tag (Bottom Center) ---- */
    .reel__music-tag {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      left: var(--space-md);
      right: 80px;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      z-index: 2;
      opacity: 0.9;
      background: rgba(16, 12, 24, 0.85);
      padding: var(--space-2xs) var(--space-sm);
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      width: fit-content;
      max-width: calc(100% - 100px);
      cursor: pointer;
      transition: opacity var(--duration-fast);
    }

    .reel__music-tag:hover {
      opacity: 1;
    }

    /* ---- Studio Waveform Visualizer (5-Bar Cyber Gradient Glow) ---- */
    .waveform-visualizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .waveform-bar {
      width: 2.5px;
      background: linear-gradient(180deg, #38bdf8 0%, #c084fc 100%);
      border-radius: 3px;
      height: 100%;
      transform-origin: bottom;
      transform: scaleY(0.25);
      transition: transform 0.2s ease, filter 0.3s ease;
      box-shadow: 0 0 6px rgba(192, 132, 252, 0.4);
    }

    .is-playing .waveform-bar {
      animation: waveDance 1.1s ease-in-out infinite alternate;
    }

    .is-playing .waveform-bar:nth-child(1) {
      animation-delay: 0.05s;
      animation-duration: 0.75s;
      background: linear-gradient(180deg, #38bdf8 0%, #a855f7 100%);
    }
    .is-playing .waveform-bar:nth-child(2) {
      animation-delay: 0.28s;
      animation-duration: 1.05s;
      background: linear-gradient(180deg, #f472b6 0%, #c084fc 100%);
    }
    .is-playing .waveform-bar:nth-child(3) {
      animation-delay: 0.12s;
      animation-duration: 0.85s;
      background: linear-gradient(180deg, #38bdf8 0%, #c084fc 100%);
    }
    .is-playing .waveform-bar:nth-child(4) {
      animation-delay: 0.38s;
      animation-duration: 1.2s;
      background: linear-gradient(180deg, #a855f7 0%, #ec4899 100%);
    }
    .is-playing .waveform-bar:nth-child(5) {
      animation-delay: 0.18s;
      animation-duration: 0.95s;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%);
    }

    @keyframes waveDance {
      0%   { transform: scaleY(0.2); }
      50%  { transform: scaleY(1.0); }
      100% { transform: scaleY(0.3); }
    }

    .reel__music-name {
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      color: var(--clr-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Reels Header (Minimal Overlay) ---- */
    .reels-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--space-lg, 24px) 16px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(6, 6, 10, 0.85) 0%, rgba(6, 6, 10, 0.4) 60%, transparent 100%);
      pointer-events: none;
    }

    .reels-header > * {
      pointer-events: auto;
    }

    .reels-header__back {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      color: var(--clr-text-primary);
      text-decoration: none;
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background var(--duration-fast);
    }

    .reels-header__back:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .reels-header__back .lucide {
      width: 18px;
      height: 18px;
    }

    .reels-header__title {
      font-family: var(--font-heading);
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--clr-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reels-header__controls {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .reels-sound-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-2xs);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--clr-text-primary);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background var(--duration-fast), transform var(--duration-fast);
    }

    .reels-sound-toggle:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .reels-sound-toggle:active {
      transform: scale(0.95);
    }

    .reels-sound-toggle .lucide {
      width: 16px;
      height: 16px;
    }

    .reels-header__counter {
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      color: var(--clr-text-secondary);
      background: rgba(0, 0, 0, 0.45);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ---- Audio Prompt Overlay ---- */
    .reels-audio-prompt {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(192, 132, 252, 0.25);
      border: 1px solid rgba(192, 132, 252, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      animation: promptFloat 2s ease-in-out infinite;
      transition: opacity 0.4s, transform 0.4s;
    }

    .reels-audio-prompt.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
      pointer-events: none;
    }

    @keyframes promptFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    /* ---- Dynamic Island Toast (Top Floating Glass Badge) ---- */
    .reel-toast-container {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 72px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      pointer-events: none;
    }

    .reel-toast {
      padding: 8px 20px;
      background: rgba(12, 10, 24, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-full);
      border: 1px solid rgba(192, 132, 252, 0.35);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75), 0 0 20px rgba(192, 132, 252, 0.25);
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #f8f3ea;
      white-space: nowrap;
      animation: reelToastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .reel-toast--exit {
      animation: reelToastOut 0.25s var(--ease-smooth) forwards;
    }

    @keyframes reelToastIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes reelToastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-10px) scale(0.95); }
    }

    /* ---- Empty Reel ---- */
    .reel--empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      background: var(--clr-bg-primary);
    }

    .reel__empty-text {
      font-family: var(--font-shayari);
      font-size: var(--text-xl);
      color: var(--clr-text-secondary);
    }

    /* ---- Scroll Hint (first load) ---- */
    .scroll-hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      z-index: 5;
      animation: scrollHintPulse 2s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.5s;
    }

    .scroll-hint.hidden {
      opacity: 0;
    }

    .scroll-hint__arrow {
      width: 20px;
      height: 20px;
      color: var(--clr-text-secondary);
      animation: scrollHintBounce 1.5s ease-in-out infinite;
    }

    .scroll-hint__text {
      font-family: var(--font-ui);
      font-size: var(--text-xs);
      color: var(--clr-text-secondary);
      letter-spacing: var(--tracking-wider);
    }

    @keyframes scrollHintPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.2; }
    }

    @keyframes scrollHintBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ---- Reduced Motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .reel__content {
        transition: none;
        opacity: 1;
        transform: none;
      }
      .reel__category,
      .reel__actions,
      .reel__music-tag {
        transition: none;
        opacity: 1;
        transform: none;
      }
      .reel__music-icon { animation: none; }
      .scroll-hint__arrow { animation: none; }
      .scroll-hint { animation: none; }
    }

    /* ---- Responsive: Small Phones & Tablets (≤768px) ---- */
    @media (max-width: 768px) {
      .reels-header {
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
      }
      .reel__category {
        top: calc(env(safe-area-inset-top, 0px) + 70px);
        left: 16px;
      }
      .reel-toast-container {
        top: calc(env(safe-area-inset-top, 0px) + 68px);
      }
      .reels-sound-toggle {
        display: none;
      }
      .reel__content {
        padding: 50px 20px 70px 20px;
      }
      .reel__text {
        font-size: clamp(1.05rem, 4.4vw, 1.35rem);
        line-height: 1.65;
      }
      .reel__actions {
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
        gap: 14px;
        transform: none;
      }
      .reel__action-btn {
        width: 44px;
        height: 44px;
      }
      .reel__action-btn .lucide {
        width: 20px;
        height: 20px;
      }
      .reel__music-tag {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
        left: 14px;
        right: 70px;
      }
    }
  </style>
</head>

<body>

  <!-- ================================
       REELS HEADER (Minimal Overlay)
       ================================ -->
  <header class="reels-header">
    <a href="index.html" class="reels-header__back" aria-label="Go back to home">
      <i data-lucide="arrow-left"></i>
      Home
    </a>

    <span class="reels-header__title">
      <img src="icons/favicon.png" alt="ShayariVerse Logo" style="width: 20px; height: 20px; border-radius: 5px; object-fit: cover;">
      Reels
    </span>

    <div class="reels-header__controls">
      <button class="reels-sound-toggle" id="reels-sound-toggle" aria-label="Toggle Sound">
        <span class="waveform-visualizer" aria-hidden="true">
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
          <span class="waveform-bar"></span>
        </span>
        <span id="sound-icon-on"><i data-lucide="volume-2"></i></span>
        <span id="sound-icon-off" style="display:none;"><i data-lucide="volume-x"></i></span>
        <span id="sound-toggle-text">Music</span>
      </button>

      <span class="reels-header__counter">
        <span id="reel-counter-current">1</span> / <span id="reel-counter-total">-</span>
      </span>
    </div>
  </header>

  <!-- ================================
       TAP TO ENABLE AUDIO PROMPT
       ================================ -->
  <div class="reels-audio-prompt" id="reels-audio-prompt">
    <i data-lucide="music-2" style="width: 16px; height: 16px;"></i>
    <span>Tap for sound</span>
  </div>

  <!-- ================================
       REELS CONTAINER (Scroll Snap)
       ================================ -->
  <main class="reels-container" id="reels-container" role="feed" aria-label="Shayari Reels">
    <!-- Loading skeleton -->
    <div class="reel" style="background: var(--clr-bg-primary); display:flex; align-items:center; justify-content:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-md);">
        <div class="skeleton" style="width:200px; height:24px; border-radius:var(--radius-sm);"></div>
        <div class="skeleton" style="width:280px; height:24px; border-radius:var(--radius-sm);"></div>
        <div class="skeleton" style="width:160px; height:24px; border-radius:var(--radius-sm);"></div>
      </div>
    </div>
  </main>

  <!-- ================================
       SCROLL HINT
       ================================ -->
  <div class="scroll-hint" id="scroll-hint">
    <i data-lucide="chevron-down" class="scroll-hint__arrow"></i>
    <span class="scroll-hint__text">Swipe up for more</span>
  </div>

  <!-- ================================
       TOAST CONTAINER (Reels)
       ================================ -->
  <div id="reel-toast-container" class="reel-toast-container" aria-live="polite"></div>

  <!-- ================================
       SCRIPTS
       ================================ -->
  <script type="module" src="js/reels-engine.js"></script>

  <!-- Hide scroll hint after first scroll (detaches listener immediately after hide) -->
  <script>
    (function() {
      const hint = document.getElementById('scroll-hint');
      const container = document.getElementById('reels-container');
      if (!hint || !container) return;
      function onScrollOnce() {
        if (container.scrollTop > 50) {
          hint.classList.add('hidden');
          container.removeEventListener('scroll', onScrollOnce);
        }
      }
      container.addEventListener('scroll', onScrollOnce, { passive: true });
    })();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch((err) => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
